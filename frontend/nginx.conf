server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets briefly; index.html always fresh
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
